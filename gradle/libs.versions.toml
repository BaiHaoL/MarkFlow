[versions]
# Kotlin 与 Android 构建工具
kotlin = "1.9.24"
agp = "8.4.0"

# Compose BOM（统一管理 Compose 相关库版本）
compose-bom = "2024.05.00"
compose-compiler = "1.5.14"

# AndroidX 核心库
core-ktx = "1.13.1"
activity-compose = "1.9.0"
lifecycle = "2.8.2"
navigation-compose = "2.7.7"

# Hilt 依赖注入
hilt = "2.51.1"
hilt-navigation-compose = "1.2.0"

# Markwon Markdown 渲染引擎
markwon = "4.6.2"
prism4j = "2.0.0"
prism4j-bundler = "2.0.0"

# 图片加载（Coil，用于 Markwon 自定义图片加载器）
coil = "2.6.0"

# 文件选择器（AndroidX DocumentFile）
documentfile = "1.0.1"

# 测试
junit = "4.13.2"
espresso = "3.5.1"

[libraries]
# AndroidX 核心
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

# Compose BOM
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Markwon
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-ext-strikethrough = { module = "io.noties.markwon:ext-strikethrough", version.ref = "markwon" }
markwon-ext-tables = { module = "io.noties.markwon:ext-tables", version.ref = "markwon" }
markwon-ext-tasklist = { module = "io.noties.markwon:ext-tasklist", version.ref = "markwon" }
markwon-syntax-highlight = { module = "io.noties.markwon:syntax-highlight", version.ref = "markwon" }
markwon-image-coil = { module = "io.noties.markwon:image-coil", version.ref = "markwon" }
markwon-html = { module = "io.noties.markwon:html", version.ref = "markwon" }
markwon-latex = { module = "io.noties.markwon:ext-latex", version.ref = "markwon" }

# Prism4j 语法高亮
prism4j-bundler = { module = "io.noties:prism4j-bundler", version.ref = "prism4j-bundler" }

# Coil
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

# 测试
junit = { module = "junit:junit", version.ref = "junit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version = "1.9.24-1.0.20" }
kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }